<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; width: 100vw; height: 100vh; overflow: hidden; cursor: none; font-family: monospace; }
  canvas { display: block; }
  #state-label {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.25); font-size: 12px; letter-spacing: 0.25em;
    text-transform: uppercase; z-index: 20;
  }
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px,
      rgba(0,255,70,0.03) 3px, rgba(0,255,70,0.03) 4px);
  }
  #tap-hint {
    position: fixed; bottom: 32px; width: 100%; text-align: center;
    color: rgba(0,255,70,0.3); font-size: 13px; letter-spacing: 0.25em;
    text-transform: uppercase; z-index: 20; animation: fadeHint 3s ease-in-out infinite;
  }
  @keyframes fadeHint { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="scanline"></div>
<canvas id="c"></canvas>
<div id="state-label"></div>
<div id="tap-hint">tap to wake larry</div>

<script>
'use strict';

// ================================================================
// CONFIG — everything you'd want to tweak is up here
// ================================================================

// Larry's size as a fraction of the shorter screen edge (0–1)
const SIZE_FRACTION    = 0.285;

// Drift speed while sleeping (px / frame at 60 fps)
const DRIFT_SPEED_MIN  = 0.9;
const DRIFT_SPEED_MAX  = 1.4;

// Time between retinal scans while sleeping (ms)
const SCAN_INTERVAL_MIN = 5000;
const SCAN_INTERVAL_MAX = 13000;

// Iris rotation speed (degrees / frame at 60 fps)
const SCAN_SPIN_SPEED  = 1.8;   // during a scan
const IDLE_SPIN_SPEED  = 0.045; // between scans

// How long one retinal scan sweep takes (ms)
const SCAN_DURATION    = 2400;

// How far the whole robot bounces vertically in awake states (px)
const BOUNCE_AMOUNT    = 18;

// Where to navigate when tapped — leave empty to window.close()
const WAKE_URL         = '';

// WebSocket bridge URL — larry-bridge.py runs on the Pi and sends state changes here
const WS_URL           = 'ws://localhost:8765';

// Arm spring physics — controls how fluidly elbows and wrists follow targets
const ARM_STIFFNESS    = 0.12;
const ARM_DAMPING      = 0.72;
const WRIST_STIFFNESS  = 0.15;

// Colours
// accentColor (green) drives body, arms, LEDs, mouth, head shell — always green
// eyeColor drives eyes, iris, antenna tip, and listening waves — changes per state
const COLOR_GREEN      = '#00ff46'; // sleeping + talking accent
const COLOR_BLUE       = '#00cfff'; // listening eyes / antenna / waves
const COLOR_RED_PUPIL  = '#ff2200'; // talking pupils
const BG_COLOR         = '#0a0a0a';

// State preview cycle — remove tickStateCycle() call when wiring openwakeword
const CYCLE_STATES     = ['sleeping', 'listening', 'talking'];
const CYCLE_DURATION   = 10000; // ms per state

// ================================================================
// DERIVED DIMENSIONS  (all scale from SIZE_FRACTION)
// Change SIZE_FRACTION above; don't change these directly.
// ================================================================

const LARRY_W  = Math.min(window.innerWidth, window.innerHeight) * SIZE_FRACTION;
const S        = LARRY_W / 260; // universal pixel scale factor

const BODY_W   = 160 * S,  BODY_H  = 72 * S,  BODY_Y  = 50 * S;
const NECK_W   = 24  * S,  NECK_H  = 18 * S,  NECK_Y  = BODY_Y - NECK_H;
const HEAD_W   = 170 * S,  HEAD_H  = 165 * S, HEAD_Y  = NECK_Y - HEAD_H;
const ANT_H    = 28  * S;
const EYE_R    = 34  * S,  EYE_OFF = 50 * S,  EYE_Y   = HEAD_Y + HEAD_H * 0.42;
const MOUTH_W  = 90  * S,  MOUTH_H = 22 * S,  MOUTH_Y = HEAD_Y + HEAD_H * 0.82;
const ARM_R    = 11  * S;  // arm tube half-thickness
const HAND_R   = 13  * S;  // hand arc radius

// ================================================================
// CANVAS
// ================================================================

const canvas     = document.getElementById('c');
const ctx        = canvas.getContext('2d');
const stateLabel = document.getElementById('state-label');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ================================================================
// RUNTIME STATE
// ================================================================

let currentState = 'sleeping';
let accentColor  = COLOR_GREEN; // body / arms / LEDs — always green
let eyeColor     = COLOR_GREEN; // eyes / antenna / waves — changes per state
let wsConnected  = false;       // true when larry-bridge WebSocket is live

// Position & drift (sleeping)
let posX = 0, posY = 0, velX = 0, velY = 0;

// Bounce & squish (awake states — applies to whole robot)
let bounceY = 0, bounceYTarget = 0, bouncePhase = 0;
let squishX = 1, squishY = 1;

// Iris
let irisAngleL = 0, irisAngleR = 0;

// Retinal scan
let scanning = false, scanTimer = 0, nextScan = 0;

// Mouth
let mouthOpen = 0, mouthOpenTarget = 0;

// Arms — spring physics elbow + wrist per side
let armLift = 0, armLiftTarget = 0;
const elbowL = { x: 0, y: 0, vx: 0, vy: 0 };
const elbowR = { x: 0, y: 0, vx: 0, vy: 0 };
let wristLx = 0, wristLy = 0, wristRx = 0, wristRy = 0;

// Pupils
let pupilRX = 5 * S, pupilRXTarget = 5 * S;
let pupilRY = 12 * S, pupilRYTarget = 12 * S;
let pupilColor = COLOR_GREEN;

// Chest LEDs — each blinks on its own independent sine wave
const ledTimers = [0,1,2,3].map(() => ({
  period: 1500 + Math.random() * 1500,
  phase:  Math.random() * Math.PI * 2,
}));

// VU activity bar value
let vuVal = 0.5;

// State cycle
let cycleTimer = 0, cycleIndex = 0;

let lastFrameTime = null;

// ================================================================
// ENTRY POINT
// ================================================================

function setup() {
  posX = window.innerWidth  / 2;
  posY = window.innerHeight / 2;
  velX = randomDriftSpeed();
  velY = randomDriftSpeed();
  nextScan = randomScanInterval();

  enterState('sleeping');
  connectWebSocket();
  requestAnimationFrame(mainLoop);

  document.addEventListener('click',      wake);
  document.addEventListener('touchstart', wake, { passive: true });
  document.addEventListener('keydown',    wake);
}

// ================================================================
// MAIN LOOP
// ================================================================

function mainLoop(ts) {
  if (!lastFrameTime) lastFrameTime = ts;
  const dt = Math.min(ts - lastFrameTime, 50);
  lastFrameTime = ts;

  tickStateCycle(dt);
  update(dt, ts);
  draw(ts);

  requestAnimationFrame(mainLoop);
}

// ================================================================
// STATE MANAGEMENT
// Call enterState('listening') / ('talking') / ('sleeping')
// from your openwakeword integration.
// ================================================================

function enterState(newState) {
  currentState = newState;
  stateLabel.textContent = newState;

  // Reset scan
  scanning = false; scanTimer = 0;
  nextScan = newState === 'sleeping' ? randomScanInterval() : Infinity;

  // Body / arms / LEDs always stay green
  accentColor = COLOR_GREEN;

  if (newState === 'sleeping') {
    eyeColor        = COLOR_GREEN;
    pupilColor      = COLOR_GREEN;
    pupilRXTarget   = 5  * S;
    pupilRYTarget   = 12 * S;
    armLiftTarget   = 0;
    mouthOpenTarget = 0;
  }

  if (newState === 'listening') {
    eyeColor        = COLOR_BLUE;  // eyes, antenna tip, and waves go blue
    pupilColor      = COLOR_BLUE;
    pupilRXTarget   = 5  * S;
    pupilRYTarget   = 12 * S;
    armLiftTarget   = 1;
    mouthOpenTarget = 0;
  }

  if (newState === 'talking') {
    eyeColor        = COLOR_GREEN;
    pupilColor      = COLOR_RED_PUPIL; // dilated red pupils
    pupilRXTarget   = 15 * S;
    pupilRYTarget   = 15 * S;
    armLiftTarget   = 1;
  }
}

// ================================================================
// UPDATE  — all physics / animation values, no drawing
// ================================================================

function update(dt, ts) {
  const dtF = dt / 16.67; // normalised to 60 fps

  if (currentState === 'sleeping') {
    updateSleeping(dt, dtF);
  } else {
    updateAwake(dt, dtF, ts);
  }

  updateArmPhysics(dtF, ts);
  updateGlobalLerps(ts);
}

function updateSleeping(dt, dtF) {
  // Drift and bounce off screen edges
  posX += velX; posY += velY;
  const hw = LARRY_W * 0.65, hh = LARRY_W * 0.80;
  if (posX - hw < 0)             { posX = hw;               velX =  Math.abs(velX); }
  if (posX + hw > canvas.width)  { posX = canvas.width-hw;  velX = -Math.abs(velX); }
  if (posY - hh < 0)             { posY = hh;               velY =  Math.abs(velY); }
  if (posY + hh > canvas.height) { posY = canvas.height-hh; velY = -Math.abs(velY); }

  // Ease back to neutral (no bounce, no squish, arms hanging)
  bounceY  = lerp(bounceY,  0, 0.10);
  squishX  = lerp(squishX,  1, 0.10);
  squishY  = lerp(squishY,  1, 0.10);
  armLift  = lerp(armLift,  0, 0.06);

  // Iris slow idle spin
  irisAngleL += IDLE_SPIN_SPEED * dtF;
  irisAngleR += IDLE_SPIN_SPEED * dtF;
  nextScan   -= dt / 1; // dt is already in ms
  if (nextScan <= 0) scanning = true;

  if (scanning) {
    irisAngleL += (SCAN_SPIN_SPEED - IDLE_SPIN_SPEED) * dtF;
    irisAngleR += (SCAN_SPIN_SPEED - IDLE_SPIN_SPEED) * dtF;
    scanTimer  += dt;
    const p   = Math.min(scanTimer / SCAN_DURATION, 1);
    const mid = Math.sin(p * Math.PI);
    pupilRXTarget = lerp(5*S, 9*S,  mid);
    pupilRYTarget = lerp(12*S, 5*S, mid);
    if (p >= 1) {
      scanning = false; scanTimer = 0;
      pupilRXTarget = 5 * S; pupilRYTarget = 12 * S;
      nextScan = randomScanInterval();
    }
  }
}

function updateAwake(dt, dtF, ts) {
  // Drift back to screen centre
  posX = lerp(posX, canvas.width  / 2, 0.08);
  posY = lerp(posY, canvas.height / 2, 0.08);

  // Whole-robot bounce
  bouncePhase  += dtF * 0.08;
  const raw     = Math.abs(Math.sin(bouncePhase));
  bounceYTarget = -raw * BOUNCE_AMOUNT;
  bounceY       = lerp(bounceY, bounceYTarget, 0.18);

  // Squish: squash wide at downbeat, stretch tall at upbeat
  squishX = lerp(squishX, 1 + (1 - raw) * 0.10, 0.18);
  squishY = lerp(squishY, 1 - (1 - raw) * 0.10, 0.18);

  armLift = lerp(armLift, armLiftTarget, 0.06);

  // Iris spins faster when awake
  irisAngleL += 0.12 * dtF;
  irisAngleR += 0.12 * dtF;

  if (currentState === 'talking') {
    mouthOpenTarget = Math.abs(Math.sin(ts * 0.018));
    const pulse     = 1 + 0.2 * Math.sin(ts * 0.003);
    pupilRXTarget   = 15 * S * pulse;
    pupilRYTarget   = 15 * S * pulse;
  } else {
    mouthOpenTarget = 0;
  }
}

// Elbow spring physics — gives arms fluid secondary motion.
// Each elbow springs toward a rest target; the wrist follows with a softer spring.
function updateArmPhysics(dtF, ts) {
  const sway = Math.sin(ts / 1800) * 4 * S;
  const t    = armLift;

  // Elbow targets: out to the side (sleep) → raised to shoulder height (awake)
  const LExT = lerp(-BODY_W * 0.90 + sway, -BODY_W * 1.0  + sway, t);
  const LEyT = lerp( BODY_Y - BODY_H * 0.1, HEAD_Y + HEAD_H * 0.5, t);
  const RExT = lerp( BODY_W * 0.90 - sway,   BODY_W * 1.0  - sway, t);
  const REyT = LEyT;

  // Wrist targets: foot of the L (sleep) → raised and outward (awake)
  const LWxT = lerp(-BODY_W * 0.90 + sway, -BODY_W * 0.95 + sway, t);
  const LWyT = lerp( BODY_Y + BODY_H * 1.5,  HEAD_Y, t);
  const RWxT = lerp( BODY_W * 0.90 - sway,   BODY_W * 0.95 - sway, t);
  const RWyT = LWyT;

  springElbow(elbowL, LExT, LEyT, dtF);
  springElbow(elbowR, RExT, REyT, dtF);

  wristLx = lerp(wristLx, LWxT, WRIST_STIFFNESS * dtF);
  wristLy = lerp(wristLy, LWyT, WRIST_STIFFNESS * dtF);
  wristRx = lerp(wristRx, RWxT, WRIST_STIFFNESS * dtF);
  wristRy = lerp(wristRy, RWyT, WRIST_STIFFNESS * dtF);
}

function springElbow(elbow, tx, ty, dtF) {
  elbow.vx += (tx - elbow.x) * ARM_STIFFNESS;
  elbow.vy += (ty - elbow.y) * ARM_STIFFNESS;
  elbow.vx *= ARM_DAMPING;
  elbow.vy *= ARM_DAMPING;
  elbow.x  += elbow.vx * dtF;
  elbow.y  += elbow.vy * dtF;
}

// Lerps that run every frame regardless of state
function updateGlobalLerps(ts) {
  mouthOpen = lerp(mouthOpen, mouthOpenTarget, 0.20);
  pupilRX   = lerp(pupilRX,   pupilRXTarget,   0.10);
  pupilRY   = lerp(pupilRY,   pupilRYTarget,   0.10);
  vuVal     = clamp(0.5 + 0.3*Math.sin(ts/900) + 0.15*Math.sin(ts/430+1) + 0.05*Math.sin(ts/200+2), 0.05, 1);
}

// ================================================================
// DRAW — pure canvas rendering
// ================================================================

function draw(ts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(posX, posY);
  ctx.scale(squishX, squishY); // squish applied to whole robot

  drawArms(ts);   // drawn first — behind body and head
  drawBody(ts);   // body box + neck + LEDs + VU bar
  drawHead(ts);   // head shell + eyes + mouth + antenna

  ctx.restore();
}

// ================================================================
// ARMS & HANDS
// Each arm = quadratic bezier from shoulder → elbow → wrist.
// Drawn as: thick black stroke (tube body) + faint green rim
// + thin offset green shine line (makes it look cylindrical).
// ================================================================

function drawArms(ts) {
  const sy  = BODY_Y + BODY_H * 0.22 + bounceY;
  const Lsx = -BODY_W / 2, Rsx = BODY_W / 2;

  // Offset elbow/wrist by bounceY so arms follow the bounce
  const Lcx = elbowL.x, Lcy = elbowL.y + bounceY;
  const Lwx = wristLx,  Lwy = wristLy  + bounceY;
  const Rcx = elbowR.x, Rcy = elbowR.y + bounceY;
  const Rwx = wristRx,  Rwy = wristRy  + bounceY;

  drawMacaroniArm(Lsx, sy, Lcx, Lcy, Lwx, Lwy, 'left');
  drawMacaroniArm(Rsx, sy, Rcx, Rcy, Rwx, Rwy, 'right');
  drawHand(Lwx, Lwy, armLift);
  drawHand(Rwx, Rwy, armLift);
}

function drawMacaroniArm(x1, y1, cx, cy, x2, y2, side) {
  const tube = ARM_R * 2;

  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // Black tube body
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.strokeStyle = '#111';
  ctx.lineWidth   = tube;
  ctx.stroke();

  // Faint green rim (makes the black tube feel like it has a coloured edge)
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.strokeStyle = accentColor;
  ctx.lineWidth   = tube;
  ctx.globalAlpha = 0.14;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Thin green shine line offset along the curve normal — fakes cylindrical roundness
  const dx  = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx  = (-dy / len) * (side === 'left' ? -1 : 1);
  const ny  = ( dx / len) * (side === 'left' ? -1 : 1);
  const off = ARM_R * 0.42;

  ctx.beginPath();
  ctx.moveTo(x1 + nx*off*0.4, y1 + ny*off*0.4);
  ctx.quadraticCurveTo(cx + nx*off, cy + ny*off, x2 + nx*off*0.4, y2 + ny*off*0.4);
  ctx.strokeStyle = accentColor;
  ctx.lineWidth   = 3 * S;
  ctx.globalAlpha = 0.55;
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();
}

// U-shaped hand arc.
// t=0 (sleep): upside-down U — bump faces down, gap opens up toward arm tip.
// t=1 (awake): right-way-up U — bump faces up, gap opens down toward arm tip.
function drawHand(wx, wy, t) {
  const hr = HAND_R;
  const lw = ARM_R * 2.2;

  // Sleep  (t=0): bottom semicircle: PI → 2*PI, centre ABOVE wrist
  // Awake  (t=1): top semicircle:    0  → PI,   centre BELOW wrist
  const startAngle = lerp(Math.PI,   0,          t);
  const endAngle   = lerp(Math.PI*2, Math.PI,    t);
  const hcy        = wy + lerp(-hr * 0.9, hr * 0.9, t);

  ctx.save();
  ctx.lineCap = 'round';

  // Black tube arc
  ctx.beginPath();
  ctx.arc(wx, hcy, hr, startAngle, endAngle, false);
  ctx.strokeStyle = '#111';
  ctx.lineWidth   = lw;
  ctx.stroke();

  // Faint green rim
  ctx.beginPath();
  ctx.arc(wx, hcy, hr, startAngle, endAngle, false);
  ctx.strokeStyle = accentColor;
  ctx.lineWidth   = lw;
  ctx.globalAlpha = 0.15;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Thin green shine on the outer face
  ctx.beginPath();
  ctx.arc(wx, hcy, hr + lw * 0.32, startAngle + 0.2, endAngle - 0.2, false);
  ctx.strokeStyle = accentColor;
  ctx.lineWidth   = 2.5 * S;
  ctx.globalAlpha = 0.60;
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ================================================================
// BODY — box, inner panel, LEDs, VU bar, neck
// ================================================================

function drawBody(ts) {
  const bx = -BODY_W / 2;
  const by = BODY_Y + bounceY;

  ctx.save();

  // Outer box
  roundRect(ctx, bx, by, BODY_W, BODY_H, 14*S);
  ctx.fillStyle = '#111'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 2.5*S; ctx.stroke();

  // Inner panel
  roundRect(ctx, bx + 22*S, by + 14*S, BODY_W - 44*S, BODY_H - 26*S, 8*S);
  ctx.fillStyle = '#0d0d0d'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1*S; ctx.stroke();

  // 4 chest LEDs — each blinks independently
  const ledSpacing = 22 * S;
  const ledY       = by + BODY_H * 0.38;
  for (let i = 0; i < 4; i++) {
    const lx = -ledSpacing * 1.5 + i * ledSpacing;
    const b  = 0.5 + 0.5 * Math.sin((ts / ledTimers[i].period) * Math.PI * 2 + ledTimers[i].phase);
    ctx.beginPath();
    ctx.arc(lx, ledY, 7*S, 0, Math.PI*2);
    ctx.fillStyle   = accentColor;
    ctx.globalAlpha = 0.2 + b * 0.75;
    ctx.fill();
    ctx.globalAlpha = 1;
    drawGlow(lx, ledY, 7*S, accentColor, 10*S);
  }

  // VU bar track
  const vuX = bx + 28*S, vuY = by + BODY_H * 0.68;
  const vuW = BODY_W - 56*S, vuH = 8*S;
  roundRect(ctx, vuX, vuY, vuW, vuH, 4*S);
  ctx.fillStyle = '#0a0a0a'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1*S; ctx.stroke();

  // VU bar fill
  roundRect(ctx, vuX + 2*S, vuY + 2*S, (vuW - 4*S) * vuVal, vuH - 4*S, 3*S);
  ctx.fillStyle = accentColor; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;

  // Neck — attaches body to head
  const nx = -NECK_W / 2, ny = by - NECK_H;
  roundRect(ctx, nx, ny, NECK_W, NECK_H, 4*S);
  ctx.fillStyle = '#1a1a1a'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1.5*S; ctx.stroke();

  // Neck ridges
  for (let i = 0; i < 3; i++) {
    const ry = ny + 5*S + i * 6*S;
    roundRect(ctx, nx + 6*S, ry, NECK_W - 12*S, 3*S, 1.5*S);
    ctx.fillStyle = accentColor; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ================================================================
// HEAD — shell, eyes, nose, mouth, ZZZ, sound waves, antenna
// All drawn with bounceY offset so head moves with body.
// ================================================================

function drawHead(ts) {
  ctx.save();
  ctx.translate(0, bounceY);

  drawHeadShell();
  drawEyes(ts);
  drawNose();
  drawMouth();
  drawSleepBubbles(ts);
  drawSoundWaves(ts);
  drawAntenna(ts);

  ctx.restore();
}

function drawHeadShell() {
  const hx = -HEAD_W / 2, hy = HEAD_Y;

  // Outer shell
  roundRect(ctx, hx, hy, HEAD_W, HEAD_H, 20*S);
  ctx.fillStyle = '#111'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 2.5*S; ctx.stroke();

  // Inner panel
  roundRect(ctx, hx + 16*S, hy + 16*S, HEAD_W - 32*S, HEAD_H - 28*S, 12*S);
  ctx.fillStyle = '#0c0c0c'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1*S; ctx.globalAlpha = 0.7; ctx.stroke(); ctx.globalAlpha = 1;

  // Top highlight strip
  roundRect(ctx, hx + 38*S, hy, HEAD_W - 76*S, 5*S, 2*S);
  ctx.fillStyle = accentColor; ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1;

  // Side vents (3 per side)
  for (let i = 0; i < 3; i++) {
    const vy = hy + 60*S + i * 14*S;
    roundRect(ctx, hx - 1*S, vy, 12*S, 6*S, 2*S);
    roundRect(ctx, hx + HEAD_W - 11*S, vy, 12*S, 6*S, 2*S);
    ctx.fillStyle = accentColor; ctx.globalAlpha = 0.4; ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ================================================================
// EYES
// Outer ring, tick marks, iris (rotating dashed rings + crosshairs),
// pupil ellipse + dark slit, specular highlight.
// eyeColor drives everything inside the eye; accentColor drives nothing here.
// ================================================================

function drawEyes(ts) {
  drawEye(-EYE_OFF, EYE_Y, irisAngleL, ts);
  drawEye( EYE_OFF, EYE_Y, irisAngleR, ts);
  drawScanBeam();
}

function drawEye(ex, ey, angle, ts) {
  ctx.save();

  // Outer ring
  ctx.beginPath();
  ctx.arc(ex, ey, EYE_R, 0, Math.PI*2);
  ctx.fillStyle = '#0a0a0a'; ctx.fill();
  ctx.strokeStyle = eyeColor; ctx.lineWidth = 2.5*S;
  ctx.shadowColor = eyeColor; ctx.shadowBlur = 8;
  ctx.stroke(); ctx.shadowBlur = 0;

  // Cardinal tick marks
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([tx,ty]) => {
    ctx.fillStyle = eyeColor; ctx.globalAlpha = 0.8;
    roundRect(ctx,
      ex + tx*(EYE_R+1*S) - (ty===0 ? 1.5*S : 4*S),
      ey + ty*(EYE_R+1*S) - (tx===0 ? 1.5*S : 3.5*S),
      tx===0 ? 8*S : 3*S, ty===0 ? 5*S : 7*S, 1.5*S);
    ctx.fill(); ctx.globalAlpha = 1;
  });

  // Iris background
  ctx.beginPath();
  ctx.arc(ex, ey, EYE_R * 0.72, 0, Math.PI*2);
  ctx.fillStyle = currentState === 'sleeping' ? '#040f04' : '#04080a';
  ctx.fill();
  ctx.strokeStyle = eyeColor; ctx.lineWidth = 1.5*S; ctx.stroke();

  // Rotating iris rings + crosshairs
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(angle * Math.PI / 180);

  [
    { r: EYE_R*0.65, dash: [8*S,6*S], w: 1.8*S, op: 0.85 },
    { r: EYE_R*0.48, dash: [6*S,5*S], w: 1.8*S, op: 0.75 },
    { r: EYE_R*0.32, dash: [4*S,5*S], w: 1.8*S, op: 0.85 },
    { r: EYE_R*0.15, dash: [],         w: 1.5*S, op: 0.60 },
  ].forEach(({ r, dash, w, op }) => {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.setLineDash(dash);
    ctx.strokeStyle = eyeColor; ctx.lineWidth = w; ctx.globalAlpha = op;
    ctx.stroke(); ctx.globalAlpha = 1;
  });
  ctx.setLineDash([]);

  ctx.strokeStyle = eyeColor; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.2*S;
  ctx.beginPath(); ctx.moveTo(0, -EYE_R*0.7); ctx.lineTo(0, EYE_R*0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-EYE_R*0.7, 0); ctx.lineTo(EYE_R*0.7, 0); ctx.stroke();
  ctx.globalAlpha = 0.35; ctx.lineWidth = 1*S;
  ctx.beginPath(); ctx.moveTo(-EYE_R*0.5,-EYE_R*0.5); ctx.lineTo(EYE_R*0.5,EYE_R*0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( EYE_R*0.5,-EYE_R*0.5); ctx.lineTo(-EYE_R*0.5,EYE_R*0.5); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // Pupil
  ctx.beginPath();
  ctx.ellipse(ex, ey, pupilRX, pupilRY, 0, 0, Math.PI*2);
  ctx.fillStyle = pupilColor; ctx.shadowColor = pupilColor; ctx.shadowBlur = 12;
  ctx.fill(); ctx.shadowBlur = 0;

  // Dark pupil slit (hidden during talking — whole pupil is solid red)
  if (currentState !== 'talking') {
    ctx.beginPath();
    ctx.ellipse(ex, ey, pupilRX * 0.45, pupilRY * 0.7, 0, 0, Math.PI*2);
    ctx.fillStyle = currentState === 'listening' ? '#000810' : '#001800';
    ctx.fill();
  }

  // Specular highlight
  ctx.beginPath();
  ctx.ellipse(ex - 2.5*S, ey - 3.5*S, 1.5*S, 3*S, 0, 0, Math.PI*2);
  ctx.fillStyle = eyeColor; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;

  ctx.restore();
}

// Retinal scan beam sweeps top-to-bottom inside the eye circles
function drawScanBeam() {
  if (!scanning) return;
  const p    = Math.min(scanTimer / SCAN_DURATION, 1);
  const mid  = Math.sin(p * Math.PI);
  const scanY = EYE_Y - EYE_R * 0.7 + p * EYE_R * 1.4;

  ctx.save();
  ctx.globalAlpha = mid * 0.9;
  ctx.strokeStyle = eyeColor; ctx.lineWidth = 2.5*S;
  ctx.shadowColor = eyeColor; ctx.shadowBlur = 8;

  for (const ex of [-EYE_OFF, EYE_OFF]) {
    ctx.save();
    ctx.beginPath(); ctx.arc(ex, EYE_Y, EYE_R * 0.7, 0, Math.PI*2); ctx.clip();
    ctx.beginPath(); ctx.moveTo(ex - EYE_R, scanY); ctx.lineTo(ex + EYE_R, scanY);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ================================================================
// NOSE
// ================================================================

function drawNose() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, HEAD_Y + HEAD_H * 0.72, 4.5*S, 0, Math.PI*2);
  ctx.fillStyle = accentColor; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// MOUTH
// Height expands when talking. Horizontal line always visible.
// ================================================================

function drawMouth() {
  const mx   = -MOUTH_W / 2;
  const openH = MOUTH_H * 0.5 + mouthOpen * MOUTH_H * 1.4;

  ctx.save();

  roundRect(ctx, mx, MOUTH_Y - openH/2, MOUTH_W, openH, 8*S);
  ctx.fillStyle = '#0a0a0a'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1.8*S; ctx.stroke();

  // Horizontal line — dims slightly when mouth is open
  ctx.beginPath();
  ctx.moveTo(mx + 10*S, MOUTH_Y); ctx.lineTo(mx + MOUTH_W - 10*S, MOUTH_Y);
  ctx.strokeStyle = accentColor; ctx.lineWidth = 2.5*S; ctx.lineCap = 'round';
  ctx.globalAlpha = currentState === 'talking' ? 0.35 : 0.75;
  ctx.stroke(); ctx.globalAlpha = 1;

  ctx.restore();
}

// ================================================================
// SLEEP BUBBLES — ZZZ text + snore circles (sleeping only)
// ================================================================

function drawSleepBubbles(ts) {
  if (currentState !== 'sleeping') return;

  // Snore circles drift upward from mouth corner
  const SNORE_PERIOD  = 2200;
  const snoreOffsets  = [0, 600, 1200];
  const snoreBaseR    = [5*S, 8*S, 11*S];
  const snoreBaseY    = [MOUTH_Y - 5*S, MOUTH_Y - 20*S, MOUTH_Y - 38*S];
  const cornerX       = MOUTH_W / 2 + 15*S;

  snoreOffsets.forEach((off, i) => {
    const t  = ((ts + off) % SNORE_PERIOD) / SNORE_PERIOD;
    const op = t < 0.15 ? t/0.15 : t < 0.6 ? 1-(t-0.15)/0.45 : 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(cornerX, snoreBaseY[i] - t * 22*S, snoreBaseR[i], 0, Math.PI*2);
    ctx.strokeStyle = accentColor; ctx.lineWidth = 1.8*S;
    ctx.globalAlpha = op * 0.8; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.restore();
  });

  // ZZZ text floats upward in staggered sequence
  const ZZZ_PERIOD   = 3200;
  const zOffsets     = [0, ZZZ_PERIOD*0.33, ZZZ_PERIOD*0.66];
  const zSizes       = [16*S, 20*S, 25*S];
  const zBaseY       = [HEAD_Y + 55*S, HEAD_Y + 30*S, HEAD_Y + 5*S];
  const zMaxOp       = [0.9, 0.75, 0.55];

  zOffsets.forEach((off, i) => {
    const t  = ((ts + off) % ZZZ_PERIOD) / ZZZ_PERIOD;
    const op = t < 0.1 ? t/0.1 : t < 0.65 ? 1-(t-0.1)/0.55 : 0;
    ctx.save();
    ctx.font = `bold ${zSizes[i]}px monospace`;
    ctx.fillStyle = accentColor; ctx.globalAlpha = op * zMaxOp[i];
    ctx.shadowColor = accentColor; ctx.shadowBlur = 6;
    ctx.fillText('Z', HEAD_W/2 - 10*S, zBaseY[i] - t * 20*S);
    ctx.restore();
  });
}

// ================================================================
// SOUND WAVES — pulsing rings around head (listening only)
// Uses eyeColor so they go blue in listening state.
// ================================================================

function drawSoundWaves(ts) {
  if (currentState !== 'listening') return;

  const WAVE_PERIOD  = 1800;
  const waveOffsets  = [0, WAVE_PERIOD*0.33, WAVE_PERIOD*0.66];
  const waveBaseR    = [EYE_R*2.2, EYE_R*3.0, EYE_R*3.8];

  waveOffsets.forEach((off, i) => {
    const t  = ((ts + off) % WAVE_PERIOD) / WAVE_PERIOD;
    const op = (t < 0.1 ? t/0.1 : 1-t) * 0.65;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, EYE_Y, waveBaseR[i] + t * 30*S, 0, Math.PI*2);
    ctx.strokeStyle = eyeColor; ctx.lineWidth = (3 - i*0.5) * S;
    ctx.globalAlpha = op; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.restore();
  });
}

// ================================================================
// ANTENNA — shaft + pulsing tip
// Tip uses eyeColor so it goes blue in listening state.
// ================================================================

function drawAntenna(ts) {
  const aty = HEAD_Y;

  ctx.save();

  // Shaft
  roundRect(ctx, -5*S, aty - ANT_H, 10*S, ANT_H, 3*S);
  ctx.fillStyle = '#1a1a1a'; ctx.fill();
  ctx.strokeStyle = accentColor; ctx.lineWidth = 1.5*S; ctx.stroke();

  // Pulsing tip — uses eyeColor
  const b  = 0.5 + 0.5 * Math.sin(ts / 600);
  ctx.beginPath(); ctx.arc(0, aty - ANT_H - 7*S, 7*S, 0, Math.PI*2);
  ctx.fillStyle   = eyeColor;
  ctx.globalAlpha = 0.25 + b * 0.75;
  ctx.shadowColor = eyeColor; ctx.shadowBlur = 12;
  ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  ctx.restore();
}

// ================================================================
// STATE CYCLING  — remove this function and its call in mainLoop
// when wiring up openwakeword
// ================================================================

function tickStateCycle(dt) {
  if (wsConnected) return;  // real events take over when bridge is connected
  cycleTimer += dt;
  if (cycleTimer >= CYCLE_DURATION) {
    cycleTimer = 0;
    cycleIndex = (cycleIndex + 1) % CYCLE_STATES.length;
    enterState(CYCLE_STATES[cycleIndex]);
  }
}

// ================================================================
// WEBSOCKET BRIDGE
// Connects to larry-bridge.py on the Pi. Receives state strings
// ('sleeping' | 'listening' | 'talking') and calls enterState().
// Automatically reconnects if the bridge restarts.
// ================================================================

function connectWebSocket() {
  let ws;
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    setTimeout(connectWebSocket, 5000);
    return;
  }

  ws.onopen = () => {
    wsConnected = true;
    console.log('[larry] bridge connected');
  };

  ws.onmessage = (event) => {
    const state = event.data.trim();
    if (['sleeping', 'listening', 'talking'].includes(state)) {
      enterState(state);
    }
  };

  ws.onclose = () => {
    wsConnected = false;
    console.log('[larry] bridge disconnected — retrying in 5s');
    setTimeout(connectWebSocket, 5000);
  };

  ws.onerror = () => ws.close();
}

// ================================================================
// WAKE / CLOSE
// ================================================================

function wake() {
  if (WAKE_URL) { window.location.href = WAKE_URL; }
  else          { window.close(); }
}

// ================================================================
// HELPERS
// ================================================================

function lerp(a, b, t)             { return a + (b - a) * t; }
function clamp(v, lo, hi)          { return v < lo ? lo : v > hi ? hi : v; }
function lerp2(a, b, t)            { return a + (b - a) * t; }  // alias used in hand drawing
function randomDriftSpeed()        { const m = DRIFT_SPEED_MIN + Math.random() * (DRIFT_SPEED_MAX - DRIFT_SPEED_MIN); return Math.random() > 0.5 ? m : -m; }
function randomScanInterval()      { return SCAN_INTERVAL_MIN + Math.random() * (SCAN_INTERVAL_MAX - SCAN_INTERVAL_MIN); }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x,     y + h, x,     y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGlow(x, y, r, color, blur) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.globalAlpha = 0.25; ctx.fill();
  ctx.restore();
}

// ================================================================
// GO
// ================================================================

setup();
</script>
